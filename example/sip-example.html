<!doctype html>
<!-- Bolna Web-Call SDK v2 demo (SIP/WebRTC transport).
     1) npm run build                                                   (produces dist/bolna-web-call.min.js)
     2) BOLNA_API_KEY=bn-... BOLNA_AGENT_ID=... node example/server-example.js   (the safe mint proxy)
     3) python3 -m http.server 8081   (from the web-call repo ROOT — the page loads ../dist/…)
     4) open http://localhost:8081/example/sip-example.html -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bolna Web-Call SDK v2 Demo</title>
    

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 30px 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Inter, Arial, sans-serif;
    color: #202124;
    background:
      radial-gradient(ellipse at top left, #ffdada 0%, transparent 45%),
      radial-gradient(ellipse at bottom right, #ffe9d5 0%, transparent 45%),
      linear-gradient(135deg, #fff7f5, #f0f3fa);
  }

  body > .app {
    width: 100%;
    max-width: 540px;
  }

  body > h2 {
    display: none;
  }

  body {
    flex-direction: column;
  }

  body > label,
  body > #sessionUrl {
    display: none !important;
  }

  .app {
    width: 100%;
    max-width: 540px;
    padding: 34px;
    background: rgba(255,255,255,.96);
    border: 1px solid rgba(255,255,255,.9);
    border-radius: 24px;
    box-shadow: 0 25px 70px rgba(90, 40, 40, .14);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 13px;
    margin-bottom: 30px;
  }

  .brand-icon {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: 15px;
    color: white;
    background: #d71920;
    font-size: 24px;
  }

  .brand-name { font-size: 18px; font-weight: 800; }
  .brand-caption { margin-top: 5px; color: #777; font-size: 12px; }

  .eyebrow {
    color: #d71920;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  h2 {
    margin: 10px 0;
    font-size: clamp(27px, 5vw, 35px);
    line-height: 1.2;
    letter-spacing: -1px;
  }

  .description {
    margin: 12px 0 26px;
    color: #6b7280;
    font-size: 14px;
    line-height: 1.8;
  }

  .call-panel {
    padding: 22px;
    background: #fffafa;
    border: 1px solid #f3e2e2;
    border-radius: 17px;
  }

  .status-label {
    margin-bottom: 12px;
    color: #777;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  #sessionUrl {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 12px;
  }

  .row {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }

  button {
    min-height: 48px;
    padding: 13px 18px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 750;
    cursor: pointer;
    transition: .2s ease;
  }

  button:hover:not(:disabled) { transform: translateY(-2px); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  #call {
    flex: 1;
    color: white;
    background: linear-gradient(135deg, #e51c23, #bb1018);
    box-shadow: 0 7px 18px rgba(215,25,32,.2);
  }

  #call.active { background: #292929; box-shadow: none; }
  #mute { min-width: 105px; color: #333; background: #eee; }

  #meter {
    height: 6px;
    margin-top: 20px;
    overflow: hidden;
    border-radius: 10px;
    background: #eee;
  }

  #meter > div {
    width: 0;
    height: 100%;
    background: #d71920;
    transition: width 80ms linear;
  }

  .log-heading { margin: 24px 0 10px; font-size: 13px; font-weight: 800; }

  #log {
    min-height: 95px;
    max-height: 180px;
    overflow: auto;
    padding: 15px;
    border: 1px solid #eee;
    border-radius: 12px;
    background: #f8f9fb;
    color: #515563;
    font: 12px/1.8 Consolas, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .footer {
    margin-top: 22px;
    color: #888;
    font-size: 11px;
    line-height: 1.7;
    text-align: center;
  }

  @media (max-width: 480px) {
    body { padding: 18px 12px; }
    .app { padding: 23px 18px; }
  }
</style>

</head>
<body>
  <h2>Bolna Web-Call SDK v2</h2>
  <label for="sessionUrl">Session endpoint (your backend — never a bn- key here)</label>
  <input
  id="sessionUrl"
  type="hidden"
  value="https://web-call-carx.onrender.com/session"
/>
  <div class="row">
    <button id="call">📞 Call</button>
    <button id="mute" disabled>Mute</button>
  </div>
  <div id="meter"><div></div></div>
  <div id="log">idle</div>

  <script src="../dist/bolna-web-call.min.js"></script>
  <script>
    const logEl = document.getElementById('log');
    const callBtn = document.getElementById('call');
    const muteBtn = document.getElementById('mute');
    const meterBar = document.querySelector('#meter > div');
    const log = (...a) => { logEl.textContent += '\n' + a.join(' '); logEl.scrollTop = logEl.scrollHeight; };

    let call = null;

    callBtn.onclick = async () => {
      if (call && call.getState() === 'active') { await call.stop(); return; }

      if (typeof BolnaWebCall === 'undefined') {
        log('ERROR: SDK bundle failed to load — run `npm run build` and serve from the repo root (see the comment at the top of this file)');
        return;
      }

      call = new BolnaWebCall({
        sessionUrl: document.getElementById('sessionUrl').value.trim(),
        debug: false,
      });
      call.on('state-change', (s) => log('state:', s));
      call.on('media-permission', () => log('mic permission granted'));
      call.on('call-start', () => {
        log('>>> connected — talk to the agent (run_id ' + call.getRunId() + ')');
        callBtn.textContent = 'Hang up';
        callBtn.classList.add('active');
        muteBtn.disabled = false;
      });
      call.on('call-end', ({ reason }) => {
        log('call ended:', reason);
        callBtn.textContent = '📞 Call';
        callBtn.classList.remove('active');
        muteBtn.disabled = true;
        muteBtn.textContent = 'Mute';
        meterBar.style.width = '0';
      });
      call.on('error', (e) => log('ERROR', e.code + ':', e.message, e.scope ? '(' + e.scope + ')' : ''));
      call.on('volume-level', (v) => { meterBar.style.width = Math.round(v * 100) + '%'; });

      callBtn.disabled = true;
      try { await call.start({ userData: (() => { try { return JSON.parse($('userData').value || 'null') || undefined; } catch { return undefined; } })() }); } catch {} finally { callBtn.disabled = false; }
    };

    muteBtn.onclick = () => {
      call.setMuted(!call.isMuted());
      muteBtn.textContent = call.isMuted() ? 'Unmute' : 'Mute';
      log(call.isMuted() ? 'muted' : 'unmuted');
    };
  </script>
</body>
</html>
