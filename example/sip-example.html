
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Credit India | Voice Assistant</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;min-height:100vh;padding:25px 16px;
 display:flex;align-items:center;justify-content:center;
 font-family:Inter,Arial,sans-serif;color:#20242c;
 background:radial-gradient(ellipse at 10% 10%,#ffd6d8,transparent 40%),
 radial-gradient(ellipse at 90% 90%,#ffe6ca,transparent 40%),
 linear-gradient(135deg,#fff8f6,#f0f3fb)
}

.card{
 width:100%;max-width:520px;background:#fff;
 padding:32px;border-radius:24px;
 box-shadow:0 24px 70px #56222218;
 border:1px solid #fff
}

.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px}
.logo{
 width:48px;height:48px;display:grid;place-items:center;
 border-radius:15px;background:#d71920;color:white;font-size:25px
}
.brand strong{display:block;font-size:17px}
.brand small{display:block;color:#777;margin-top:5px}
.tag{font-size:11px;font-weight:800;letter-spacing:2px;color:#d71920}
h1{font-size:32px;letter-spacing:-1px;line-height:1.2;margin:10px 0}
.desc{font-size:14px;line-height:1.8;color:#707783;margin:12px 0 25px}

.panel{padding:20px;border:1px solid #f1e3e3;background:#fffafa;border-radius:17px}
.status{display:flex;align-items:center;gap:9px;margin-bottom:16px;font-size:13px;color:#555}
.dot{width:9px;height:9px;border-radius:50%;background:#aaa;flex-shrink:0}
.row{display:flex;gap:10px}

button{
 min-height:48px;padding:12px 16px;border:0;border-radius:12px;
 font-size:14px;font-weight:750;cursor:pointer;transition:.2s
}
button:hover:not(:disabled){transform:translateY(-2px)}
button:disabled{opacity:.45;cursor:not-allowed}

#call{flex:1;background:linear-gradient(135deg,#e51c23,#bb1018);color:white;box-shadow:0 6px 16px #d7192030}
#call.active{background:#292929;box-shadow:none}
#mute{min-width:100px;background:#eee;color:#333}

#meter{height:5px;background:#eee;border-radius:10px;overflow:hidden;margin-top:18px}
#meter>div{height:100%;width:0;background:#d71920;transition:width 80ms linear}

.logtitle{font-size:12px;font-weight:800;margin:23px 0 9px;color:#555}
#log{
 min-height:75px;max-height:160px;overflow:auto;padding:13px;
 border:1px solid #eee;border-radius:11px;background:#f7f8fa;
 color:#4d5563;font:12px/1.8 Consolas,monospace;
 white-space:pre-wrap;overflow-wrap:anywhere
}

footer{text-align:center;color:#888;font-size:11px;line-height:1.7;margin-top:20px}

@media(max-width:480px){
 .card{padding:23px 18px}
 h1{font-size:28px}
 .panel{padding:16px}
}
</style>
</head>

<body>
<main class="card">

  <div class="brand">
    <div class="logo">☎</div>
    <div>
      <strong>Home Credit India</strong>
      <small>Customer assistance</small>
    </div>
  </div>

  <div class="tag">VOICE ASSISTANT</div>
  <h1>Talk to Ananya</h1>
  <p class="desc">
    Connect with our virtual assistant to discuss your
    Loan Against Property eligibility. Allow microphone
    access when prompted.
  </p>

  <section class="panel">
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">Ready to connect</span>
    </div>

    <input
      id="sessionUrl"
      type="hidden"
      value="https://web-call-carx.onrender.com/session"
    >

    <div class="row">
      <button id="call">☎ Start a call</button>
      <button id="mute" disabled>Mute</button>
    </div>

    <div id="meter"><div></div></div>

    <div class="logtitle">CALL ACTIVITY</div>
    <div id="log">Ready when you are.</div>
  </section>

  <footer>
    Home Credit India · Virtual Assistant Demo
  </footer>

</main>

<script src="../dist/bolna-web-call.min.js"></script>
<script>
const logEl=document.getElementById('log');
const callBtn=document.getElementById('call');
const muteBtn=document.getElementById('mute');
const meterBar=document.querySelector('#meter>div');
const dot=document.getElementById('dot');
const statusText=document.getElementById('statusText');
const log=(...a)=>{logEl.textContent+='\n'+a.join(' ');logEl.scrollTop=logEl.scrollHeight};
const setStatus=(text,color='#aaa')=>{statusText.textContent=text;dot.style.background=color};
let call=null;
callBtn.onclick=async()=>{
 if(call&&call.getState()==='active'){await call.stop();return}
 if(typeof BolnaWebCall==='undefined'){log('ERROR: SDK failed to load. Check the SDK bundle.');setStatus('SDK unavailable','#d71920');return}
 call=new BolnaWebCall({sessionUrl:document.getElementById('sessionUrl').value.trim(),debug:false});
 call.on('state-change',s=>{log('State:',s);if(s==='connecting')setStatus('Connecting…','#e7a321');if(s==='ringing')setStatus('Calling Ananya…','#e7a321');if(s==='active')setStatus('Call connected','#16a34a');if(s==='ended')setStatus('Call ended','#888')});
 call.on('media-permission',()=>log('Microphone permission granted'));
 call.on('call-start',()=>{log('Connected — you can speak to Ananya. Run ID:',call.getRunId());callBtn.textContent='Hang up';callBtn.classList.add('active');muteBtn.disabled=false;setStatus('Call connected','#16a34a')});
 call.on('call-end',({reason})=>{log('Call ended:',reason);callBtn.textContent='☎  Start a call';callBtn.classList.remove('active');muteBtn.disabled=true;muteBtn.textContent='Mute';meterBar.style.width='0';setStatus('Ready to connect','#aaa')});
 call.on('error',e=>{log('ERROR',e.code+':',e.message,e.scope?'('+e.scope+')':'');setStatus('Connection error','#d71920')});
 call.on('volume-level',v=>meterBar.style.width=Math.round(v*100)+'%');
 callBtn.disabled=true;
 try{await call.start()}catch(e){log('Unable to start call:',e?.message||'Please try again');setStatus('Unable to connect','#d71920')}
 finally{callBtn.disabled=false}
};
muteBtn.onclick=()=>{if(!call)return;call.setMuted(!call.isMuted());muteBtn.textContent=call.isMuted()?'Unmute':'Mute';log(call.isMuted()?'Microphone muted':'Microphone unmuted')};
</script>
</body>
</html>
