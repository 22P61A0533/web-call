<!doctype html>
<!-- Bolna Web-Call SDK v2 demo (SIP/WebRTC transport).
     1) npm run build                                                   (produces dist/bolna-web-call.min.js)
     2) BOLNA_API_KEY=bn-... BOLNA_AGENT_ID=... node example/server-example.js   (the safe mint proxy)
     3) python3 -m http.server 8081   (from the web-call repo ROOT — the page loads ../dist/…)
     4) open http://localhost:8081/example/sip-example.html -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bolna Web-Call SDK v2 Demo</title>
    
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    color: #202124;
    background: linear-gradient(135deg, #fff5f5, #f4f6fa);
  }

  .app {
    width: 100%;
    max-width: 520px;
    padding: 34px;
    background: #fff;
    border: 1px solid #f0e6e6;
    border-radius: 22px;
    box-shadow: 0 18px 55px rgba(35, 25, 25, 0.09);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 30px;
  }

  .brand-icon {
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    border-radius: 14px;
    color: white;
    background: #d71920;
    font-size: 23px;
  }

  .brand-name {
    font-size: 17px;
    font-weight: 750;
    letter-spacing: -0.4px;
  }

  .brand-caption {
    margin-top: 4px;
    color: #777;
    font-size: 12px;
  }

  .eyebrow {
    margin: 0 0 10px;
    color: #d71920;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.7px;
    text-transform: uppercase;
  }

  h2 {
    margin: 0;
    font-size: clamp(25px, 5vw, 32px);
    letter-spacing: -1px;
    line-height: 1.2;
  }

  .description {
    margin: 12px 0 26px;
    color: #6b7280;
    font-size: 14px;
    line-height: 1.7;
  }

  .call-panel {
    padding: 20px;
    border: 1px solid #eee;
    border-radius: 16px;
    background: #fafafa;
  }

  .status-label {
    margin-bottom: 12px;
    color: #6b7280;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  #sessionUrl {
    width: 100%;
    padding: 12px;
    border: 1px solid #dedede;
    border-radius: 9px;
    outline: none;
    background: white;
    color: #555;
    font: inherit;
    font-size: 12px;
  }

  #sessionUrl:focus {
    border-color: #d71920;
    box-shadow: 0 0 0 3px rgba(215, 25, 32, 0.1);
  }

  .row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  button {
    min-height: 46px;
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, opacity 0.2s;
  }

  button:hover:not(:disabled) {
    transform: translateY(-1px);
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  #call {
    flex: 1;
    color: white;
    background: #d71920;
    box-shadow: 0 5px 14px rgba(215, 25, 32, 0.18);
  }

  #call.active {
    background: #252525;
    box-shadow: none;
  }

  #mute {
    min-width: 105px;
    color: #303030;
    background: #eaeaea;
  }

  #meter {
    height: 5px;
    margin-top: 18px;
    overflow: hidden;
    border-radius: 20px;
    background: #e7e7e7;
  }

  #meter > div {
    width: 0;
    height: 100%;
    background: #d71920;
    transition: width 80ms linear;
  }

  .log-heading {
    margin: 25px 0 10px;
    font-size: 13px;
    font-weight: 750;
  }

  #log {
    min-height: 90px;
    max-height: 170px;
    overflow-y: auto;
    padding: 14px;
    border: 1px solid #eee;
    border-radius: 12px;
    background: #f8f8f8;
    color: #505050;
    font: 12px/1.8 ui-monospace, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .footer {
    margin-top: 20px;
    color: #8b8b8b;
    font-size: 11px;
    line-height: 1.6;
    text-align: center;
  }

  @media (max-width: 480px) {
    body {
      padding: 18px 12px;
    }

    .app {
      padding: 23px 18px;
      border-radius: 17px;
    }
  }
</style>
</head>
<body>
  <h2>Bolna Web-Call SDK v2</h2>
  <label for="sessionUrl">Session endpoint (your backend — never a bn- key here)</label>
  <input
  id="sessionUrl"
  type="hidden"
  value="https://web-call-carx.onrender.com/session"
/>
  <div class="row">
    <button id="call">📞 Call</button>
    <button id="mute" disabled>Mute</button>
  </div>
  <div id="meter"><div></div></div>
  <div id="log">idle</div>

  <script src="../dist/bolna-web-call.min.js"></script>
  <script>
    const logEl = document.getElementById('log');
    const callBtn = document.getElementById('call');
    const muteBtn = document.getElementById('mute');
    const meterBar = document.querySelector('#meter > div');
    const log = (...a) => { logEl.textContent += '\n' + a.join(' '); logEl.scrollTop = logEl.scrollHeight; };

    let call = null;

    callBtn.onclick = async () => {
      if (call && call.getState() === 'active') { await call.stop(); return; }

      if (typeof BolnaWebCall === 'undefined') {
        log('ERROR: SDK bundle failed to load — run `npm run build` and serve from the repo root (see the comment at the top of this file)');
        return;
      }

      call = new BolnaWebCall({
        sessionUrl: document.getElementById('sessionUrl').value.trim(),
        debug: false,
      });
      call.on('state-change', (s) => log('state:', s));
      call.on('media-permission', () => log('mic permission granted'));
      call.on('call-start', () => {
        log('>>> connected — talk to the agent (run_id ' + call.getRunId() + ')');
        callBtn.textContent = 'Hang up';
        callBtn.classList.add('active');
        muteBtn.disabled = false;
      });
      call.on('call-end', ({ reason }) => {
        log('call ended:', reason);
        callBtn.textContent = '📞 Call';
        callBtn.classList.remove('active');
        muteBtn.disabled = true;
        muteBtn.textContent = 'Mute';
        meterBar.style.width = '0';
      });
      call.on('error', (e) => log('ERROR', e.code + ':', e.message, e.scope ? '(' + e.scope + ')' : ''));
      call.on('volume-level', (v) => { meterBar.style.width = Math.round(v * 100) + '%'; });

      callBtn.disabled = true;
      try { await call.start({ userData: (() => { try { return JSON.parse($('userData').value || 'null') || undefined; } catch { return undefined; } })() }); } catch {} finally { callBtn.disabled = false; }
    };

    muteBtn.onclick = () => {
      call.setMuted(!call.isMuted());
      muteBtn.textContent = call.isMuted() ? 'Unmute' : 'Mute';
      log(call.isMuted() ? 'muted' : 'unmuted');
    };
  </script>
</body>
</html>
